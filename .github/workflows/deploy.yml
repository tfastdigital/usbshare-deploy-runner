name: Deploy UsbShare Endpoints
on:
  workflow_dispatch:
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload service-config
        env:
          WEB_HOST: ${{ secrets.WEB_SSH_HOST }}
          WEB_PORT: ${{ secrets.WEB_SSH_PORT }}
          WEB_USER: ${{ secrets.WEB_SSH_USER }}
          WEB_PASS: ${{ secrets.WEB_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="${WEB_HOST}"
          PORT="${WEB_PORT}"
          USER="${WEB_USER}"
          export SSHPASS="${WEB_PASS}"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40 -p $PORT"
          SCP="sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40 -P $PORT"
          ROOT="/home/${USER}/domains/tfastdigital.com/public_html"
          $SSH "$USER@$HOST" "mkdir -p ${ROOT}/api/gsm-usb-server && ls -la ${ROOT} | head"
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg={
            "controlUrl":"http://31.97.99.137:5088",
            "downloadUrl":"https://tfastdigital.com/Gsm-usb-server",
            "currentVersion":"2.1.0",
            "minimumCustomerVersion":"2.1.0",
            "minimumTechnicianVersion":"2.1.0",
            "status":"ok",
            "message":""
          }
          Path('/tmp/service-config.json').write_text(json.dumps(cfg,indent=2)+'\n')
          Path('/tmp/service-config.php').write_text("""<?php
header('Content-Type: application/json; charset=utf-8');
header('Access-Control-Allow-Origin: *');
header('Cache-Control: no-store, max-age=0');
echo json_encode([
  'controlUrl' => 'http://31.97.99.137:5088',
  'downloadUrl' => 'https://tfastdigital.com/Gsm-usb-server',
  'currentVersion' => '2.1.0',
  'minimumCustomerVersion' => '2.1.0',
  'minimumTechnicianVersion' => '2.1.0',
  'status' => 'ok',
  'message' => '',
], JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT);
""")
          Path('/tmp/htaccess').write_text("""<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^service-config$ service-config.php [L]
</IfModule>
DirectoryIndex service-config.php index.php
""")
          print('ok')
          PY
          $SCP /tmp/service-config.json "$USER@$HOST:${ROOT}/gsm-usb-server-service.json"
          $SCP /tmp/service-config.json "$USER@$HOST:${ROOT}/api/gsm-usb-server/service-config.json"
          $SCP /tmp/service-config.json "$USER@$HOST:${ROOT}/api/gsm-usb-server/service-config"
          $SCP /tmp/service-config.php "$USER@$HOST:${ROOT}/api/gsm-usb-server/service-config.php"
          $SCP /tmp/service-config.php "$USER@$HOST:${ROOT}/api/gsm-usb-server/index.php"
          $SCP /tmp/htaccess "$USER@$HOST:${ROOT}/api/gsm-usb-server/.htaccess"
          $SSH "$USER@$HOST" "ls -la ${ROOT}/api/gsm-usb-server; head -c 300 ${ROOT}/gsm-usb-server-service.json; echo"
      - name: Verify
        run: |
          for u in \
            https://tfastdigital.com/gsm-usb-server-service.json \
            https://tfastdigital.com/api/gsm-usb-server/service-config \
            https://tfastdigital.com/api/gsm-usb-server/service-config.php \
            https://tfastdigital.com/api/gsm-usb-server/service-config.json; do
            echo "=== $u ==="
            code=$(curl -sS -o /tmp/b -w "%{http_code}" "$u" || echo fail)
            echo "HTTP $code"
            head -c 400 /tmp/b; echo
          done
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy API package from public URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          PKG_URL: ${{ secrets.API_PKG_URL }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST}"
          USER="${VPS_USER}"
          export SSHPASS="${VPS_PASSWORD}"
          PKG="${PKG_URL:-https://litter.catbox.moe/8z1bts.tgz}"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40"
          $SSH "$USER@$HOST" bash -s <<EOF
          set -e
          systemctl stop usbshare-api || true
          docker rm -f usbshare-api || true
          fuser -k 5088/tcp || true
          fuser -k 5089/tcp || true
          fuser -k 5090/tcp || true
          mkdir -p /opt/usbshare/api
          curl -fL --retry 8 -o /tmp/api.tgz "$PKG"
          rm -rf /opt/usbshare/api/*
          tar -xzf /tmp/api.tgz -C /opt/usbshare/api
          chmod +x /opt/usbshare/api/UsbShare.Cloud.Api
          if [ -f /opt/usbshare/api/install-usbshare-api.sh ]; then
            bash /opt/usbshare/api/install-usbshare-api.sh
          else
            cat >/etc/systemd/system/usbshare-api.service <<'UNIT'
          [Unit]
          Description=GSM USB Server Cloud API
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          WorkingDirectory=/opt/usbshare/api
          ExecStart=/opt/usbshare/api/UsbShare.Cloud.Api
          Restart=always
          RestartSec=3
          Environment=ASPNETCORE_ENVIRONMENT=Production
          Environment=ASPNETCORE_URLS=http://0.0.0.0:5088
          Environment=DataPlane__PublicHost=31.97.99.137
          Environment=DataPlane__Port=5089
          Environment=DataPlane__UsbIpPort=5090
          Environment=LocalDiscovery__Enabled=false
          Environment=NetworkSecurity__AllowPrivateNetworks=true
          Environment=NetworkSecurity__BlockVpnOrProxy=false
          Environment=NetworkSecurity__BlockHostingOrDatacenter=false
          LimitNOFILE=65535
          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl enable usbshare-api
            systemctl restart usbshare-api
          fi
          sleep 3
          curl -fsS http://127.0.0.1:5088/health; echo
          curl -fsS http://127.0.0.1:5088/api/service; echo
          EOF
      - name: Public health
        run: |
          curl -fsS --max-time 25 http://31.97.99.137:5088/health || true
          echo
          curl -fsS --max-time 25 http://31.97.99.137:5088/api/service || true
