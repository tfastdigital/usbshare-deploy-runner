name: Deploy UsbShare Endpoints
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload service-config
        env:
          WEB_HOST: ${{ secrets.WEB_SSH_HOST }}
          WEB_PORT: ${{ secrets.WEB_SSH_PORT }}
          WEB_USER: ${{ secrets.WEB_SSH_USER }}
          WEB_PASS: ${{ secrets.WEB_SSH_PASSWORD }}
        run: python3 upload_website.py
      - name: Verify
        run: |
          for u in https://tfastdigital.com/gsm-usb-server-service.json https://tfastdigital.com/api/gsm-usb-server/service-config https://tfastdigital.com/api/gsm-usb-server/service-config.php https://tfastdigital.com/api/gsm-usb-server/service-config.json; do
            echo "=== $u ==="
            curl -sS -o /tmp/b -w "HTTP %{http_code}\n" "$u" || true
            head -c 400 /tmp/b; echo
          done
  vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy VPS API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          PKG_URL: ${{ secrets.API_PKG_URL }}
        run: python3 deploy_vps.py
      - name: Public health
        run: |
          curl -fsS --max-time 25 http://31.97.99.137:5088/health || true
          echo
          curl -fsS --max-time 25 http://31.97.99.137:5088/api/service || true
